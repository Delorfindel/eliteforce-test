project_id = "eliteforce-multiservices"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = false

[auth]
enabled = true
site_url = "eliteforce://login"
additional_redirect_urls = ["eliteforce://login", "eliteforce://update-password"]
jwt_expiry = 3600
enable_signup = true
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
